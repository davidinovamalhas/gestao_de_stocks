<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Stock Profissional</title>
    <!-- Biblioteca oficial do Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        
        /* Estilos dos Separadores (Tabs) */
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 25px; gap: 5px; }
        .tab-button { background: #eee; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px 6px 0 0; color: #555; transition: 0.2s; }
        .tab-button:hover { background: #e0e0e0; }
        .tab-button.active { background: #2c3e50; color: white; border-bottom: 2px solid #2c3e50; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Formulários */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        /* Botão Submeter */
        .btn-submit { background-color: #2ecc71; color: white; padding: 12px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-submit:hover { background-color: #27ae60; }
        .radio-group { display: flex; gap: 20px; margin: 10px 0; }
        .radio-group label { font-weight: normal; display: inline; }
        
        /* Tabelas e Alertas */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Linha a Vermelho se o Stock for 0 */
        tr.stock-zero { background-color: #fadbd8 !important; color: #78281f; }
        .badge-zero { background-color: #e74c3c; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        
        .alerta-vazio { color: #7f8c8d; text-align: center; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Sistema de Gestão de Stocks</h1>
    
    <!-- Barra de Separadores -->
    <div class="tabs">
        <button class="tab-button active" onclick="mudarSeparador('listagem')">📋 Listagem de Stock</button>
        <button class="tab-button" onclick="mudarSeparador('movimentos')">🔄 Movimentos (Entrada/Saída)</button>
    </div>

    <!-- SEPARADOR 1: LISTAGEM DE STOCKS -->
    <div id="separador-listagem" class="tab-content active">
        <h2>Visualização do Inventário</h2>
        <div id="tabelaStock">Carregando dados da nuvem...</div>
    </div>

    <!-- SEPARADOR 2: MOVIMENTOS -->
    <div id="separador-movimentos" class="tab-content">
        <h2>Registar Entrada ou Saída de Artigo</h2>
        
        <div class="form-group">
            <label for="tipoArtigo">O artigo já existe no sistema?</label>
            <select id="tipoArtigo" onchange="alternarCamposArtigo()">
                <option value="novo">Não, é um artigo novo</option>
                <option value="existente">Sim, selecionar da lista</option>
            </select>
        </div>

        <div class="form-group" id="grupoArtigoNovo">
            <label for="artigoNovo">Nome do Novo Artigo</label>
            <input type="text" id="artigoNovo" placeholder="Ex: Arroz Agulha">
        </div>

        <div class="form-group" id="grupoArtigoExistente" style="display: none;">
            <label for="artigoExistente">Selecione o Artigo Existente</label>
            <select id="artigoExistente"></select>
        </div>

        <div id="camposOpcionais">
            <div class="form-group">
                <label for="unidade">Unidade (Und)</label>
                <select id="unidade">
                    <option value="Un">Un</option>
                    <option value="Kg">Kg</option>
                    <option value="Cx">Cx</option>
                    <option value="Ltr">Ltr</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fornecedor">Fornecedor</label>
                <input type="text" id="fornecedor" placeholder="Ex: Fornecedor A">
            </div>
            <div class="form-group">
                <label for="armazem">Armazém / Localização</label>
                <input type="text" id="armazem" placeholder="Ex: Corredor 2">
            </div>
            <div class="form-group">
                <label for="preco">Preço (Opcional)</label>
                <input type="number" id="preco" step="0.01" min="0" value="0.00">
            </div>
            <div class="form-group">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" rows="2" placeholder="Notas adicionais..."></textarea>
            </div>
        </div>

        <div class="form-group">
            <label>Tipo de Movimento</label>
            <div class="radio-group">
                <label><input type="radio" name="movimento" value="entrada" checked> 🟢 Entrada (Adicionar)</label>
                <label><input type="radio" name="movimento" value="saida"> 🔴 Saída (Remover)</label>
            </div>
        </div>

        <div class="form-group">
            <label for="quantidade">Quantidade do Movimento</label>
            <input type="number" id="quantidade" min="1" value="1">
        </div>

        <button class="btn-submit" onclick="confirmarMovimento()">Confirmar Lançamento</button>
    </div>
</div>

<script>
    // ⚠️ SUBSTITUA COM OS SEUS DADOS REAIS DO SUPABASE
    const SUPABASE_URL = "https://njwajakwymllffqcmlmt.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_6pJKQEy9vDYeowOyPus5Mw_vQVGMDF2";
    
    const _supabase = supabaseJS.createClient(SUPABASE_URL, SUPABASE_KEY);
    let cacheStock = [];

    // Função para gerir a navegação entre separadores
    function mudarSeparador(idSeparador) {
        // Remove a classe ativa de todos os botões e conteúdos
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        // Adiciona a classe ativa ao separador clicado
        if(idSeparador === 'listagem') {
            document.querySelectorAll('.tab-button')[0].classList.add('active');
            document.getElementById('separador-listagem').classList.add('active');
            carregarDados(); // Atualiza a tabela sempre que clica no separador de listagem
        } else {
            document.querySelectorAll('.tab-button')[1].classList.add('active');
            document.getElementById('separador-movimentos').classList.add('active');
        }
    }

    async function carregarDados() {
        let { data: artigos, error } = await _supabase
            .from('artigos')
            .select('*')
            .order('artigo', { ascending: true });

        if (error) {
            console.error(error);
            document.getElementById('tabelaStock').innerHTML = "Erro ao conectar ao Supabase.";
            return;
        }

        cacheStock = artigos || [];
        atualizarInterface();
    }

    function alternarCamposArtigo() {
        const tipo = document.getElementById('tipoArtigo').value;
        document.getElementById('grupoArtigoNovo').style.display = tipo === 'novo' ? 'block' : 'none';
        document.getElementById('grupoArtigoExistente').style.display = tipo === 'existente' ? 'block' : 'none';
        document.getElementById('camposOpcionais').style.display = tipo === 'novo' ? 'block' : 'none';
    }

    function atualizarInterface() {
        const tabelaDiv = document.getElementById('tabelaStock');
        const selectExistente = document.getElementById('artigoExistente');
        
        if (cacheStock.length === 0) {
            tabelaDiv.innerHTML = '<p class="alerta-vazio">O inventário está vazio na nuvem.</p>';
        } else {
            let htmlTable = `<table>
                <tr>
                    <th>Artigo</th><th>Und</th><th>Fornecedor</th><th>Armazém</th><th>Preço</th><th>Stock atual</th><th>Observações</th>
                </tr>`;
            
            cacheStock.forEach(item => {
                // Se o stock for 0, adiciona a classe css 'stock-zero'
                let classeLinha = item.stock_atual === 0 ? 'class="stock-zero"' : '';
                let textoStock = item.stock_atual === 0 ? `${item.stock_atual} <span class="badge-zero">ESGOTADO</span>` : item.stock_atual;

                htmlTable += `<tr ${classeLinha}>
                    <td><b>${item.artigo}</b></td>
                    <td>${item.unidade || 'Un'}</td>
                    <td>${item.fornecedor || '-'}</td>
                    <td>${item.armazem || '-'}</td>
                    <td>${item.preco > 0 ? item.preco.toFixed(2) + '€' : '-'}</td>
                    <td>${textoStock}</td>
                    <td>${item.observacoes || '-'}</td>
                </tr>`;
            });
            htmlTable += '</table>';
            tabelaDiv.innerHTML = htmlTable;
        }

        // Atualiza a lista dropdown do outro separador
        selectExistente.innerHTML = '';
        cacheStock.forEach(item => {
            let opt = document.createElement('option');
