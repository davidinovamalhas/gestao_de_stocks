<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Stock Profissional</title>
    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; }

        /* Separadores (Tabs) */
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 25px; gap: 5px; flex-wrap: wrap; }
        .tab-button { background: #eee; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px 6px 0 0; color: #555; transition: 0.2s; }
        .tab-button:hover { background: #e0e0e0; }
        .tab-button.active { background: #2c3e50; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Formulários */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: inherit; }

        .btn-submit { background-color: #2ecc71; color: white; padding: 12px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-submit:hover { background-color: #27ae60; }
        .btn-submit:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .radio-group { display: flex; gap: 20px; margin: 10px 0; }
        .radio-group label { font-weight: normal; display: inline-flex; align-items: center; gap: 6px; width: auto; }
        .radio-group input { width: auto; }

        /* Tabelas e alertas */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr.stock-zero { background-color: #fadbd8 !important; color: #78281f; }
        .badge-zero { background-color: #e74c3c; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .alerta-vazio { color: #7f8c8d; text-align: center; font-style: italic; padding: 20px; }

        /* Mensagens de feedback */
        #mensagem { display: none; padding: 12px 15px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        #mensagem.ok { display: block; background: #d5f5e3; color: #1e8449; border: 1px solid #a9dfbf; }
        #mensagem.erro { display: block; background: #fadbd8; color: #922b21; border: 1px solid #f1948a; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Sistema de Gestão de Stocks</h1>

    <!-- Barra de Separadores -->
    <div class="tabs" role="tablist">
        <button id="btn-listagem" class="tab-button active" role="tab" aria-selected="true" onclick="mudarSeparador('listagem')">📋 Listagem de Stock</button>
        <button id="btn-movimentos" class="tab-button" role="tab" aria-selected="false" onclick="mudarSeparador('movimentos')">🔄 Movimentos (Entrada/Saída)</button>
    </div>

    <div id="mensagem" role="status"></div>

    <!-- SEPARADOR 1: LISTAGEM DE STOCKS -->
    <div id="separador-listagem" class="tab-content active" role="tabpanel">
        <h2>Visualização do Inventário</h2>
        <div id="tabelaStock">A carregar dados da nuvem...</div>
    </div>

    <!-- SEPARADOR 2: MOVIMENTOS -->
    <div id="separador-movimentos" class="tab-content" role="tabpanel">
        <h2>Registar Entrada ou Saída de Artigo</h2>

        <div class="form-group">
            <label for="tipoArtigo">O artigo já existe no sistema?</label>
            <select id="tipoArtigo" onchange="alternarCamposArtigo()">
                <option value="novo">Não, é um artigo novo</option>
                <option value="existente">Sim, selecionar da lista</option>
            </select>
        </div>

        <div class="form-group" id="grupoArtigoNovo">
            <label for="artigoNovo">Nome do Novo Artigo</label>
            <input type="text" id="artigoNovo" placeholder="Ex: Arroz Agulha" maxlength="120">
        </div>

        <div class="form-group" id="grupoArtigoExistente" style="display: none;">
            <label for="artigoExistente">Selecione o Artigo Existente</label>
            <select id="artigoExistente"></select>
        </div>

        <div id="camposOpcionais">
            <div class="form-group">
                <label for="unidade">Unidade (Und)</label>
                <select id="unidade">
                    <option value="Un">Un</option>
                    <option value="Kg">Kg</option>
                    <option value="Cx">Cx</option>
                    <option value="Ltr">Ltr</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fornecedor">Fornecedor</label>
                <input type="text" id="fornecedor" placeholder="Ex: Fornecedor A" maxlength="120">
            </div>
            <div class="form-group">
                <label for="armazem">Armazém / Localização</label>
                <input type="text" id="armazem" placeholder="Ex: Corredor 2" maxlength="120">
            </div>
            <div class="form-group">
                <label for="preco">Preço (Opcional)</label>
                <input type="number" id="preco" step="0.01" min="0" value="0.00">
            </div>
            <div class="form-group">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" rows="2" placeholder="Notas adicionais..." maxlength="500"></textarea>
            </div>
        </div>

        <div class="form-group">
            <label>Tipo de Movimento</label>
            <div class="radio-group">
                <label><input type="radio" name="movimento" value="entrada" checked> 🟢 Entrada (Adicionar)</label>
                <label><input type="radio" name="movimento" value="saida"> 🔴 Saída (Remover)</label>
            </div>
        </div>

        <div class="form-group">
            <label for="quantidade">Quantidade do Movimento</label>
            <input type="number" id="quantidade" min="0" step="any" value="1">
        </div>

        <button id="btnConfirmar" class="btn-submit" onclick="confirmarMovimento()">Confirmar Lançamento</button>
    </div>
</div>

<script>
    // ⚠️ Use apenas a URL RAIZ do projeto (sem /rest/v1/) e a chave pública (publishable/anon)
    const SUPABASE_URL = "https://njwajakwymllffqcmlmt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6pJKQEy9vDYeowOyPus5Mw_vQVGMDF2";

    // A biblioteca via CDN expõe o global "supabase"
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let cacheStock = [];
    let mensagemTimer = null;

    /* ---------- Utilitários ---------- */

    // Escapa HTML para evitar XSS
    function esc(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function formatarNumero(n) {
        // Evita ruído de vírgula flutuante (ex.: 0.30000000000000004)
        return Number(Number(n).toFixed(3)).toString();
    }

    function mostrarMensagem(texto, tipo = 'ok') {
        const el = document.getElementById('mensagem');
        el.textContent = texto;
        el.className = tipo;
        clearTimeout(mensagemTimer);
        mensagemTimer = setTimeout(() => { el.className = ''; el.textContent = ''; }, 6000);
    }

    /* ---------- Navegação ---------- */

    function mudarSeparador(idSeparador) {
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.classList.remove('active');
            btn.setAttribute('aria-selected', 'false');
        });
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        const btn = document.getElementById('btn-' + idSeparador);
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        document.getElementById('separador-' + idSeparador).classList.add('active');

        if (idSeparador === 'listagem') carregarDados();
    }

    /* ---------- Dados ---------- */

    async function carregarDados() {
        const { data: artigos, error } = await _supabase
            .from('artigos')
            .select('*')
            .order('artigo', { ascending: true });

        if (error) {
            console.error(error);
            document.getElementById('tabelaStock').textContent =
                'Erro ao carregar dados: ' + (error.message || 'falha de ligação ao Supabase.');
            return;
        }

        cacheStock = artigos || [];
        atualizarInterface();
    }

    function alternarCamposArtigo() {
        const tipo = document.getElementById('tipoArtigo').value;
        document.getElementById('grupoArtigoNovo').style.display = tipo === 'novo' ? 'block' : 'none';
        document.getElementById('grupoArtigoExistente').style.display = tipo === 'existente' ? 'block' : 'none';
        document.getElementById('camposOpcionais').style.display = tipo === 'novo' ? 'block' : 'none';
    }

    function atualizarInterface() {
        const tabelaDiv = document.getElementById('tabelaStock');
        const selectExistente = document.getElementById('artigoExistente');

        if (cacheStock.length === 0) {
            tabelaDiv.innerHTML = '<p class="alerta-vazio">O inventário está vazio na nuvem.</p>';
        } else {
            let html = `<div class="table-wrap"><table>
                <tr>
                    <th>Artigo</th><th>Und</th><th>Fornecedor</th><th>Armazém</th><th>Preço</th><th>Stock atual</th><th>Observações</th>
                </tr>`;

            cacheStock.forEach(item => {
                const stock = Number(item.stock_atual) || 0;
                const preco = Number(item.preco) || 0;
                const esgotado = stock <= 0;

                html += `<tr ${esgotado ? 'class="stock-zero"' : ''}>
                    <td><b>${esc(item.artigo)}</b></td>
                    <td>${esc(item.unidade || 'Un')}</td>
                    <td>${esc(item.fornecedor || '-')}</td>
                    <td>${esc(item.armazem || '-')}</td>
                    <td>${preco > 0 ? preco.toFixed(2) + '€' : '-'}</td>
                    <td>${formatarNumero(stock)}${esgotado ? ' <span class="badge-zero">ESGOTADO</span>' : ''}</td>
                    <td>${esc(item.observacoes || '-')}</td>
                </tr>`;
            });
            html += '</table></div>';
            tabelaDiv.innerHTML = html;
        }

        // Lista de artigos existentes (o valor é o ID, não o nome)
        const selecionado = selectExistente.value;
        selectExistente.innerHTML = '';
        cacheStock.forEach(item => {
            const opt = document.createElement('option');
            opt.value = String(item.id);
            opt.textContent = `${item.artigo} (${item.unidade || 'Un'})`;
            selectExistente.appendChild(opt);
        });
        if (selecionado) selectExistente.value = selecionado;
    }

    /* ---------- Movimentos ---------- */

    function limparFormulario() {
        document.getElementById('artigoNovo').value = '';
        document.getElementById('unidade').value = 'Un';
        document.getElementById('fornecedor').value = '';
        document.getElementById('armazem').value = '';
        document.getElementById('preco').value = '0.00';
        document.getElementById('observacoes').value = '';
        document.getElementById('quantidade').value = '1';
        document.querySelector('input[name="movimento"][value="entrada"]').checked = true;
    }

    async function confirmarMovimento() {
        const btn = document.getElementById('btnConfirmar');
        const tipoArtigo = document.getElementById('tipoArtigo').value;
        const movimento = document.querySelector('input[name="movimento"]:checked').value;
        const quantidade = parseFloat(String(document.getElementById('quantidade').value).replace(',', '.'));

        // Validação da quantidade
        if (!Number.isFinite(quantidade) || quantidade <= 0) {
            mostrarMensagem('Indique uma quantidade válida, superior a zero.', 'erro');
            return;
        }

        btn.disabled = true;
        try {
            if (tipoArtigo === 'novo') {
                await registarArtigoNovo(movimento, quantidade);
            } else {
                await registarMovimentoExistente(movimento, quantidade);
            }
        } catch (err) {
            console.error(err);
            mostrarMensagem('Erro: ' + (err.message || 'não foi possível gravar o movimento.'), 'erro');
        } finally {
            btn.disabled = false;
        }
    }

    async function registarArtigoNovo(movimento, quantidade) {
        const nome = document.getElementById('artigoNovo').value.trim().replace(/\s+/g, ' ');

        if (!nome) {
            mostrarMensagem('Indique o nome do novo artigo.', 'erro');
            return;
        }
        if (movimento === 'saida') {
            mostrarMensagem('Não é possível registar uma saída de um artigo novo (sem stock).', 'erro');
            return;
        }

        // Verifica duplicados (ignorando maiúsculas/minúsculas e espaços)
        await carregarDados();
        const duplicado = cacheStock.some(a => String(a.artigo).trim().toLowerCase() === nome.toLowerCase());
        if (duplicado) {
            mostrarMensagem('Já existe um artigo com esse nome. Use "Sim, selecionar da lista".', 'erro');
            return;
        }

        const preco = parseFloat(document.getElementById('preco').value);

        const { error } = await _supabase.from('artigos').insert({
            artigo: nome,
            unidade: document.getElementById('unidade').value,
            fornecedor: document.getElementById('fornecedor').value.trim() || null,
            armazem: document.getElementById('armazem').value.trim() || null,
            preco: Number.isFinite(preco) && preco > 0 ? preco : 0,
            observacoes: document.getElementById('observacoes').value.trim() || null,
            stock_atual: quantidade
        });

        if (error) throw error;

        mostrarMensagem(`Artigo "${nome}" criado com ${formatarNumero(quantidade)} em stock.`);
        limparFormulario();
        await carregarDados();
    }

    async function registarMovimentoExistente(movimento, quantidade) {
        const id = document.getElementById('artigoExistente').value;
        if (!id) {
            mostrarMensagem('Selecione um artigo da lista.', 'erro');
            return;
        }

        // Atualização com "bloqueio otimista": só grava se o stock não mudou entretanto.
        // Se outro utilizador alterou o stock, repete com o valor mais recente.
        const MAX_TENTATIVAS = 4;
        for (let i = 0; i < MAX_TENTATIVAS; i++) {
            const { data: atual, error: erroLeitura } = await _supabase
                .from('artigos')
                .select('id, artigo, stock_atual')
                .eq('id', id)
                .single();
            if (erroLeitura) throw erroLeitura;

            const stockAtual = Number(atual.stock_atual) || 0;
            const novoStock = movimento === 'entrada' ? stockAtual + quantidade : stockAtual - quantidade;

            if (novoStock < 0) {
                mostrarMensagem(
                    `Stock insuficiente: "${atual.artigo}" tem apenas ${formatarNumero(stockAtual)} disponível.`,
                    'erro'
                );
                await carregarDados();
                return;
            }

            const { data: atualizado, error: erroUpdate } = await _supabase
                .from('artigos')
                .update({ stock_atual: novoStock })
                .eq('id', id)
                .eq('stock_atual', atual.stock_atual)   // garante que ninguém alterou entretanto
                .select();
            if (erroUpdate) throw erroUpdate;

            if (atualizado && atualizado.length > 0) {
                mostrarMensagem(
                    `${movimento === 'entrada' ? 'Entrada' : 'Saída'} registada: "${atual.artigo}" ` +
                    `${formatarNumero(stockAtual)} → ${formatarNumero(novoStock)}.`
                );
                document.getElementById('quantidade').value = '1';
                await carregarDados();
                return;
            }
            // Nenhuma linha atualizada = conflito; tenta outra vez
        }

        throw new Error('O stock foi alterado por outro utilizador. Tente novamente.');
    }

    /* ---------- Arranque ---------- */
    alternarCamposArtigo();
    carregarDados();
</script>

</body>
</html>
